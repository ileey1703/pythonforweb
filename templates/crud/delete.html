{% extends "expedition/base.html" %}

{% block title %}{{ page_title }} | TransConnect{% endblock %}

{% block content %}
    <section class="panel confirm-panel">
        <span class="warning-icon" aria-hidden="true">!</span>
        <p class="eyebrow">CONFIRMATION</p>
        <h1>{{ page_title }}</h1>
        <p class="confirm-copy">Vous êtes sur le point de supprimer <strong>{{ object }}</strong>. Cette action est définitive.</p>
        <form method="post" class="confirm-actions">
            {% csrf_token %}
            <a class="button button-secondary" href="{% url list_url %}">Annuler</a>
            <button class="button button-danger" type="submit">Oui, supprimer</button>
        </form>
    </section>
{% endblock %}
