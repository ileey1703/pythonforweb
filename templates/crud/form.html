{% extends "expedition/base.html" %}

{% block title %}{{ page_title }} | TransConnect{% endblock %}

{% block content %}
    <div class="page-heading">
        <div>
            <p class="eyebrow">GESTION</p>
            <h1>{{ page_title }}</h1>
        </div>
    </div>
    <section class="panel form-panel">
        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="form-errors" role="alert">{{ form.non_field_errors }}</div>
            {% endif %}
            {{ form.as_p }}
            <div class="panel-actions">
                <a class="button button-secondary" href="{% url list_url %}">Annuler</a>
                <button class="button button-primary" type="submit">{{ submit_label }}</button>
            </div>
        </form>
    </section>
{% endblock %}
